name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          restore_cache: "false"

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.set-any.outputs.has-changes }}
      web: ${{ steps.filter.outputs.web }}
      core: ${{ steps.filter.outputs.core }}
      other-service: ${{ steps.filter.outputs.other-service }}
      api-utils: ${{ steps.filter.outputs.api-utils }}
      infra: ${{ steps.filter.outputs.infra }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - packages/web/**
              - packages/api-utils/**
            core:
              - microservices/core/**
              - packages/api-utils/**
            other-service:
              - microservices/other-service/**
              - packages/api-utils/**
            api-utils:
              - packages/api-utils/**
            infra:
              - infra/**
              - sst.config.ts
              - package.json
              - bun.lock
              - bun.lockb
              - .github/workflows/**
            docs:
              - docs/**
              - .kiro/**
              - '**/*.md'

      # `has-changes` gates the heavyweight typecheck / lint / build /
      # test jobs below. Without `docs` in the OR, docs-only PRs would
      # evaluate `has-changes=false` and those jobs would be SKIPPED —
      # and GitHub branch protection treats a skipped required check as
      # "pending", which would deadlock every docs-only PR once
      # required-status rules are turned on. Including docs here makes
      # the gate run on every PR (trivially passing when no code
      # changed) and keeps branch protection workable. Inspector Brad's
      # MEDIUM-severity finding on PR #43 has the full reasoning.
      - name: Set has-changes
        id: set-any
        run: |
          if [ "${{ steps.filter.outputs.web }}" == "true" ] || \
             [ "${{ steps.filter.outputs.core }}" == "true" ] || \
             [ "${{ steps.filter.outputs.other-service }}" == "true" ] || \
             [ "${{ steps.filter.outputs.api-utils }}" == "true" ] || \
             [ "${{ steps.filter.outputs.infra }}" == "true" ] || \
             [ "${{ steps.filter.outputs.docs }}" == "true" ]; then
            echo "has-changes=true" >> $GITHUB_OUTPUT
          else
            echo "has-changes=false" >> $GITHUB_OUTPUT
          fi

  typecheck-lint-prettier:
    name: Typecheck, Lint & Prettier
    runs-on: ubuntu-latest
    needs: [install, changes]
    if: needs.changes.outputs.has-changes == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Prettier
        run: bun run prettier:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [install, typecheck-lint-prettier]
    if: needs.changes.outputs.has-changes == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: bun run build

  unit-tests:
    name: Unit Tests & Coverage (90% minimum)
    runs-on: ubuntu-latest
    needs: [install, typecheck-lint-prettier]
    if: needs.changes.outputs.has-changes == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Unit tests with coverage (minimum 90%)
        run: bun run test:unit
        env:
          # Vitest will enforce 90% coverage thresholds defined in vitest.config.ts
          # If coverage falls below 90%, this step will fail the PR
          CI: true
